
name: Daily S&P 500 SEC Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "20 12 * * 1-5"

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-sec-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run investigative scanner
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scanner.py

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report.json history.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update daily S&P 500 investigative report"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Updated report pushed successfully."
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Push failed after 3 attempts." >&2
                exit 1
              fi
              sleep 3
            done
          fi


      - name: Publish early warnings as GitHub issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          with open("report.json", encoding="utf-8") as file:
              report = json.load(file)
          changes = report.get("changes", {})
          alerts = changes.get("early_warnings", [])
          if not alerts:
              print("No new early warning alerts.")
              raise SystemExit(0)
          date = report["updated_at"][:10]
          title = f"SEC early warnings — {date}"
          lines = ["Automated SEC filing review-priority alerts (not allegations or trading signals).", ""]
          for company in report["companies"]:
              if company["ticker"] not in alerts:
                  continue
              lines.append(f"### {company['ticker']} — {company['company']}")
              lines.append(f"Review score: {company['risk_score']}; change: {company.get('score_change')}")
              for item in company.get("new_filings", []):
                  lines.append(f"- [{item['date']} {item['form']} — {item['description']}]({item['url']})")
              lines.append("")
          repo = os.environ["GITHUB_REPOSITORY"]
          existing = subprocess.run(["gh", "issue", "list", "--repo", repo, "--state", "all", "--search", title, "--json", "title"], capture_output=True, text=True, check=True)
          if any(issue["title"] == title for issue in json.loads(existing.stdout)):
              print("Today's alert issue already exists.")
          else:
              subprocess.run(["gh", "issue", "create", "--repo", repo, "--title", title, "--body", "\\n".join(lines)], check=True)
          PY
